<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BuiltBetter Fitness</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-50 text-gray-800">
  <main class="min-h-screen p-6 md:p-12">

    <!-- HERO -->
    <section class="max-w-5xl mx-auto text-center space-y-6">
      <p class="inline-block px-4 py-2 rounded-full bg-green-100 text-green-800 text-sm font-semibold">
        30-Day Beginner Consistency Program
      </p>

      <h1 class="text-4xl md:text-5xl font-bold leading-tight">
        Stop Guessing. Know Exactly What To Do Every Workout.
      </h1>

      <p class="text-lg text-gray-600 max-w-3xl mx-auto">
        BuiltBetter creates a personalized 30-day plan based on your
        schedule, equipment, experience, and goal.
      </p>
    </section>

    <!-- FORM -->
    <section class="max-w-3xl mx-auto mt-16">
      <h2 class="text-2xl font-bold text-center mb-6">
        Get Your Free Plan Preview
      </h2>

      <form id="planForm" class="bg-white p-6 rounded-2xl shadow space-y-4">

        <input required type="email" name="email" placeholder="Your email address"
               class="w-full border p-3 rounded-lg">

        <input required type="text" name="goal" placeholder="Your main goal (fat loss, muscle gain, etc)"
               class="w-full border p-3 rounded-lg">

        <select required name="experience" class="w-full border p-3 rounded-lg">
          <option value="" disabled selected>Experience level</option>
          <option value="Beginner">Beginner</option>
          <option value="Intermediate">Intermediate</option>
          <option value="Advanced">Advanced</option>
        </select>

        <select required name="days" class="w-full border p-3 rounded-lg">
          <option value="" disabled selected>Days per week you can train</option>
          <option value="3">3 days/week</option>
          <option value="4">4 days/week</option>
        </select>

        <textarea name="equipment" placeholder="Equipment available (gym, dumbbells, none)"
                  class="w-full border p-3 rounded-lg"></textarea>

        <textarea name="notes" placeholder="Injuries or special notes"
                  class="w-full border p-3 rounded-lg"></textarea>

        <button id="submitBtn"
                class="w-full bg-green-600 text-white py-3 rounded-xl font-semibold hover:bg-green-700 transition">
          Generate My Plan →
        </button>
      </form>
    </section>

    <footer class="text-center mt-20 text-sm text-gray-500">
      © 2026 BuiltBetter Fitness
    </footer>

  </main>

  <!-- SCRIPT -->
  <script>
    const ZAPIER_HOOK_URL = "https://hooks.zapier.com/hooks/catch/25952455/uwqz6ym/";
    const form = document.getElementById("planForm");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const formData = new FormData(form);

      try {
        await fetch(ZAPIER_HOOK_URL, {
          method: "POST",
          body: formData
        });

        // 🔥 Pass form data to thank-you page
        const params = new URLSearchParams(formData).toString();
        window.location.href = "./thank-you.html?" + params;

      } catch (err) {
        alert("There was an issue submitting the form. Please try again.");
      }
    });
  </script>

</body>
</html>
