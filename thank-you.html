<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Personalized Week 1</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-green-50 p-6">

<div class="max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow">

<h1 class="text-3xl font-bold text-green-700 mb-4">
Your Personalized Week 1 Plan
</h1>

<div id="planOutput" class="space-y-6"></div>

<hr class="my-8">

<p class="text-xl font-bold text-center">
Unlock the Full 30-Day Program for $9
</p>

<a href="https://buy.stripe.com/3cI6oJge69yzgSa70o7AI01"
   class="block text-center mt-4 bg-green-600 text-white py-3 rounded-lg font-semibold">
Unlock My Full Plan →
</a>

</div>

<script>
const params = new URLSearchParams(window.location.search);

const goal = params.get("goal");
const days = params.get("days");
const experience = params.get("experience");

const planDiv = document.getElementById("planOutput");

function createDay(title, exercises) {
  return `
  <div>
    <h2 class="text-xl font-semibold">${title}</h2>
    <ul class="list-disc pl-6 mt-2">
      ${exercises.map(e => `<li>${e}</li>`).join("")}
    </ul>
  </div>
  `;
}

let output = "";

if(days == "3") {
  output += createDay("Day 1 – Full Body",
    ["Squat – 3x8",
     "Bench Press – 3x8",
     "Lat Pulldown – 3x10",
     "RDL – 2x10",
     "Plank – 2x30s"]);

  output += createDay("Day 2 – Conditioning",
    ["20 min incline walk",
     "Core circuit x2 rounds"]);

  output += createDay("Day 3 – Full Body",
    ["Split Squat – 3x10",
     "Incline DB Press – 3x10",
     "Row – 3x10",
     "Lateral Raise – 2x12",
     "Curl + Triceps – 2x12"]);
}

if(days == "4") {
  output += createDay("Day 1 – Upper",
    ["Bench – 3x8",
     "Row – 3x10",
     "Shoulders – 2x12",
     "Arms – 2x12"]);

  output += createDay("Day 2 – Lower",
    ["Squat – 3x8",
     "RDL – 3x10",
     "Lunges – 2x10"]);

  output += createDay("Day 3 – Rest or Cardio",
    ["20–30 min steady cardio"]);

  output += createDay("Day 4 – Full Body",
    ["Leg Press – 3x10",
     "DB Bench – 3x10",
     "Pulldown – 3x10"]);
}

planDiv.innerHTML = output;
</script>

</body>
</html>
